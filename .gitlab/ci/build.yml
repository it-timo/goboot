# ==============================================================================
#  GitLab CI build job for goboot
# ==============================================================================
#
#  Required variables:
#    - GO_1_25_DIGEST
#    - GO_1_26_DIGEST
#
# ==============================================================================

build-branch:
  stage: build
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG == null && $CI_PIPELINE_SOURCE != 'merge_request_event' && $CI_COMMIT_BRANCH != 'main' && $CI_COMMIT_BRANCH != 'master'
      when: manual
  parallel:
    matrix:
      - GO_VERSION: "1.25"
        GO_DIGEST: $GO_1_25_DIGEST
      - GO_VERSION: "1.26"
        GO_DIGEST: $GO_1_26_DIGEST
  image: golang@${GO_DIGEST}
  script:
    - go build -v ./...

build-auto:
  stage: build
  only:
    - main
    - master
  except:
    - tags
  parallel:
    matrix:
      - GO_VERSION: "1.25"
        GO_DIGEST: $GO_1_25_DIGEST
      - GO_VERSION: "1.26"
        GO_DIGEST: $GO_1_26_DIGEST
  image: golang@${GO_DIGEST}
  script:
    - go build -v ./...

build-tag:
  stage: build
  only:
    - tags
  except:
    - branches
  parallel:
    matrix:
      - GO_VERSION: "1.25"
        GO_DIGEST: $GO_1_25_DIGEST
      - GO_VERSION: "1.26"
        GO_DIGEST: $GO_1_26_DIGEST
  image: golang@${GO_DIGEST}
  script:
    - go build -v ./...
