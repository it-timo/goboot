# ==============================================================================
#  GitLab CI test job for goboot
# ==============================================================================
#
#  Required variables:
#    - GO_1_25_DIGEST
#    - GO_1_26_DIGEST
#
# ==============================================================================

test-branch:
  stage: test
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG == null && $CI_PIPELINE_SOURCE != 'merge_request_event' && $CI_COMMIT_BRANCH != 'main' && $CI_COMMIT_BRANCH != 'master'
      when: manual
  parallel:
    matrix:
      - GO_VERSION: "1.25"
        GO_DIGEST: $GO_1_25_DIGEST
      - GO_VERSION: "1.26"
        GO_DIGEST: $GO_1_26_DIGEST
  image: golang@${GO_DIGEST}
  script:
    - go test -race -timeout=5m -coverprofile=coverage.txt ./...
    - go tool cover -func=coverage.txt
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      - coverage.txt
    expire_in: 1 week

test-auto:
  stage: test
  only:
    - main
    - master
  except:
    - tags
  parallel:
    matrix:
      - GO_VERSION: "1.25"
        GO_DIGEST: $GO_1_25_DIGEST
      - GO_VERSION: "1.26"
        GO_DIGEST: $GO_1_26_DIGEST
  image: golang@${GO_DIGEST}
  script:
    - go test -race -timeout=5m -coverprofile=coverage.txt ./...
    - go tool cover -func=coverage.txt
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      - coverage.txt
    expire_in: 1 week

test-tag:
  stage: test
  only:
    - tags
  except:
    - branches
  parallel:
    matrix:
      - GO_VERSION: "1.25"
        GO_DIGEST: $GO_1_25_DIGEST
      - GO_VERSION: "1.26"
        GO_DIGEST: $GO_1_26_DIGEST
  image: golang@${GO_DIGEST}
  script:
    - go test -race -timeout=5m -coverprofile=coverage.txt ./...
    - go tool cover -func=coverage.txt
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      - coverage.txt
    expire_in: 1 week
