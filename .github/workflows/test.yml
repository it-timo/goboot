name: Test

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26.5']
    steps:
      - name: Checkout code
        # Used commit SHA for actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Go ${{ matrix.go-version }}
        # Used commit SHA for actions/setup-go@v6.4.0
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run Tests
        run: |
          go test -race -timeout=5m -coverprofile=coverage.txt ./...
          go tool cover -func=coverage.txt | tee coverage-summary.txt
          ./scripts/check_coverage.sh coverage.txt 80

      - name: Upload coverage report
        if: ${{ github.actor != 'nektos/act' }}
        # Used commit SHA for actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-report-go-${{ matrix.go-version }}
          path: |
            coverage.txt
            coverage-summary.txt
          retention-days: 7
