name: Test

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - "badges/coverage.json"
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25', '1.26']
    steps:
      - name: Checkout code
        # Used commit SHA for actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Go ${{ matrix.go-version }}
        # Used commit SHA for actions/setup-go@v6.2.0
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run Tests
        run: |
          go test -race -timeout=5m -coverprofile=coverage.txt ./...
          go tool cover -func=coverage.txt | tee coverage-summary.txt

      - name: Upload coverage report
        # Used commit SHA for actions/upload-artifact@v4.6.0
        uses: actions/upload-artifact@604373da6381bf24206979c74d06a550515601b9
        with:
          name: coverage-report-go-${{ matrix.go-version }}
          path: |
            coverage.txt
            coverage-summary.txt
          retention-days: 7

  coverage-badge:
    name: Update coverage badge payload
    runs-on: ubuntu-24.04
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        # Used commit SHA for actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download coverage artifacts
        # Used commit SHA for actions/download-artifact@v4.1.8
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: coverage-report-go-*
          path: .tmp/coverage-artifacts
          merge-multiple: false

      - name: Generate badges/coverage.json
        run: |
          set -euo pipefail

          mapfile -t coverage_values < <(
            find .tmp/coverage-artifacts -type f -name "coverage-summary.txt" \
              -exec awk '/^total:/ { gsub("%", "", $3); print $3 }' {} \;
          )

          if [[ "${#coverage_values[@]}" -eq 0 ]]; then
            echo "No coverage summaries found."
            exit 1
          fi

          coverage_min="$(
            printf '%s\n' "${coverage_values[@]}" \
              | awk 'NR == 1 || $1 < min { min = $1 } END { printf "%.1f", min }'
          )"

          coverage_color="$(
            awk -v c="${coverage_min}" '
              BEGIN {
                if (c >= 90) print "brightgreen";
                else if (c >= 80) print "green";
                else if (c >= 70) print "yellow";
                else print "red";
              }'
          )"

          mkdir -p badges
          cat > badges/coverage.json <<EOF
          {"schemaVersion":1,"label":"coverage","message":"${coverage_min}%","color":"${coverage_color}"}
          EOF

      - name: Commit badge payload
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.json
          if git diff --cached --quiet; then
            echo "Coverage payload unchanged."
            exit 0
          fi
          git commit -m "chore(ci): update coverage badge payload [skip ci]"
          git push
