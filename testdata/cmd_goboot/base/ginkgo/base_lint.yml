sourcePath: ${TEMPLATES_LINT_BASE}
linters:
  golang:
    cmd: |-
      {{DOCKER_RUN}} golangci/golangci-lint:v2.12.2 golangci-lint run ./...
    enabled: true
  yaml:
    cmd: |-
      {{DOCKER_RUN}} pipelinecomponents/yamllint:0.35.9 yamllint .
    enabled: true
  markdown:
    cmd: |-
      {{DOCKER_RUN}} ghcr.io/igorshubovych/markdownlint-cli:v0.48.0 markdownlint "**/*.md"
    enabled: true
  shellcheck:
    cmd: |-
      {{DOCKER_RUN}} koalaman/shellcheck:v0.11.0 -x {{SH_FILES}}
    enabled: true
  shfmt:
    cmd: |-
      {{DOCKER_RUN}} mvdan/shfmt:v3.13.1 -d -i 2 -ci {{SH_FILES}}
    enabled: true
  editor:
    cmd: |-
      {{DOCKER_RUN}} --entrypoint ec mstruebing/editorconfig-checker:v3.6.1 -exclude '(\.git)'
    enabled: true
allowedPackages:
  - gopkg.in/yaml.v3
