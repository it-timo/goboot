stages:
  - lint
  - test
  - build

variables:
  # Faster Docker storage driver for CI runners.
  DOCKER_DRIVER: overlay2
  # Disable TLS cert dir for local dind usage.
  DOCKER_TLS_CERTDIR: ""

include:
  - local: .gitlab/ci/versions.yml
  - local: .gitlab/ci/commands.yml
  - local: .gitlab/ci/lint.yml
  - local: .gitlab/ci/test.yml
  - local: .gitlab/ci/build.yml
