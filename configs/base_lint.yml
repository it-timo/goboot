# Config for the `base_lint` service.
# Safe to commit; no secrets.

# Template source.

#  Directory where the templates will be read from.
sourcePath: "templates/lint_base"

# Linter definitions.
# Each entry needs: `cmd`, `enabled`.
# Disabled linters are skipped.
# Placeholders:
# - ROOT_DIR: project root (`pwd`)
# - DOCKER_RUN: docker wrapper command
# - SH_FILES: `find . -type f -name "*.sh"`
linters:
  golang:          #  name of the linter scope
    cmd: |-
      {{DOCKER_RUN}} golangci/golangci-lint:v2.12.0 golangci-lint run ./...
    enabled: true  #  enable state
  yaml:
    cmd: |-
      {{DOCKER_RUN}} pipelinecomponents/yamllint:0.35.9 yamllint .
    enabled: true
  make:
    cmd: |-
      {{DOCKER_RUN}} cytopia/checkmake:latest-0.5 Makefile
    enabled: true
  markdown:
    cmd: |-
      {{DOCKER_RUN}} ghcr.io/igorshubovych/markdownlint-cli:v0.47.0 markdownlint "**/*.md"
    enabled: true
  shellcheck:
    cmd: |-
      {{DOCKER_RUN}} koalaman/shellcheck:v0.11.0 -x {{SH_FILES}}
    enabled: true
  shfmt:
    cmd: |-
      {{DOCKER_RUN}} mvdan/shfmt:v3.12.0 -d -i 2 -ci {{SH_FILES}}
    enabled: true
  editor:
    cmd: |-
      {{DOCKER_RUN}} --entrypoint ec mstruebing/editorconfig-checker:v3.6.0 -exclude '(\.git|\.idea|\.vscode)'
    enabled: true

# Allowed import exceptions for depguard.
allowedPackages:
  - gopkg.in/yaml.v3
  - github.com/onsi/ginkgo/v2
  - github.com/onsi/gomega
  - github.com/rs/zerolog
  - github.com/rs/zerolog/log
