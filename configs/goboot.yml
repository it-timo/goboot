# Root config for one goboot generation run.
# Safe to commit; no secrets.
# Service execution order is defined in code, not in this file.

# Output root.

#  Directory where generated projects will be written
targetPath: "outputs"

# Project identity.

#  Project name (used in CLI output, directory names, and package names)
projectName: "IntroProject"

#  Primary project URL (GitHub/GitLab repository home URL used by go.mod and lint)
repoUrl: "https://github.com/projects"

#  Git provider (used for provider-specific templates)
gitProvider: "gitlab"

# Enabled services for this run.
# Each entry needs: `id`, `confPath`, `enabled`.
# Unknown IDs fail fast; disabled services are skipped.

services:
  - id: "base_project"                      #  Unique service identifier (must match internal constant)
    confPath: "./configs/base_project.yml"  #  Path to the YAML config file for this service
    enabled: true                           #  Enable or disable this module
  - id: "base_lint"
    confPath: "./configs/base_lint.yml"
    enabled: true
  - id: "base_test"
    confPath: "./configs/base_test.yml"
    enabled: true
  - id: "base_logger"
    confPath: "./configs/base_logger.yml"
    enabled: true
  - id: "base_docker"
    confPath: "./configs/base_docker.yml"
    enabled: true
  - id: "base_local"
    confPath: "./configs/base_local.yml"
    enabled: true
  - id: "base_ci"
    confPath: "./configs/base_ci.yml"
    enabled: true
