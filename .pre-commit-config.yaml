# Local pre-commit hooks for lint and test checks.

repos:
  - repo: local
    hooks:
      - id: golint
        name: golangci-lint (docker)
        entry: |
          bash -lc 'source versions.env && docker run --rm -v "$PWD:/workdir" -w /workdir \
            golangci/golangci-lint:${GOLANGCI_LINT_VERSION} golangci-lint run ./...'
        language: system
        pass_filenames: false

      - id: yamllint
        name: yamllint (docker)
        entry: |
          bash -lc 'source versions.env && docker run --rm -v "$PWD:/workdir" -w /workdir \
            pipelinecomponents/yamllint:${YAMLLINT_VERSION} yamllint .'
        language: system
        pass_filenames: false

      - id: checkmake
        name: checkmake (docker)
        entry: |
          bash -lc 'source versions.env && docker run --rm -v "$PWD:/workdir" -w /workdir \
            cytopia/checkmake:${CHECKMAKE_VERSION} Makefile'
        language: system
        pass_filenames: false

      - id: markdownlint
        name: markdownlint (docker)
        entry: |
          bash -lc 'source versions.env && docker run --rm -v "$PWD:/workdir" -w /workdir \
            ghcr.io/igorshubovych/markdownlint-cli:${MARKDOWNLINT_VERSION} "**/*.md"'
        language: system
        pass_filenames: false

      - id: shellcheck
        name: shellcheck (docker)
        entry: |
          bash -lc 'source versions.env && docker run --rm -v "$PWD:/workdir" -w /workdir \
            koalaman/shellcheck:${SHELLCHECK_VERSION} \
            -x $(find . -type f -name "*.sh" -not -path "./templates/*")'
        language: system
        pass_filenames: false

      - id: shfmt
        name: shfmt (check only, docker)
        entry: |
          bash -lc 'source versions.env && docker run --rm -v "$PWD:/workdir" -w /workdir \
            mvdan/shfmt:${SHFMT_VERSION} \
            -d -i 2 -ci $(find . -type f -name "*.sh" -not -path "./templates/*")'
        language: system
        pass_filenames: false

      - id: editorconfig-checker
        name: editorconfig-checker (docker)
        entry: |
          bash -lc 'source versions.env && docker run --rm -v "$PWD:/workdir" -w /workdir \
            --entrypoint ec mstruebing/editorconfig-checker:${EDITORCONFIG_CHECKER_VERSION} \
            -exclude "(\.git|\.idea)"'
        language: system
        pass_filenames: false

      - id: base_test
        name: go test
        entry: >
          bash -lc '
            set -euo pipefail
            TEST_PKGS="$(go list ./... | grep -v "/test/noauto" | grep -v "/templates")"
            go test -race -timeout=9m -coverprofile=coverage.txt ${TEST_PKGS}
            go tool cover -func=coverage.txt
            rm -f coverage.txt
          '
        language: system
        pass_filenames: false

      - id: verify_intro
        name: Verify IntroProject
        entry: ./scripts/verify_introproject.sh
        language: system
        pass_filenames: false
