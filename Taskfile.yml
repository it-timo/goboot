# Task aliases for local development and CI parity.

version: "3"

# Load shared tool versions.
dotenv: ['versions.env']

# Dynamic variables.
vars:
  VERSION:
    sh: cat .version  #  Reads a version from a file (used for builds and prints)

  MD_FILES:
    sh: >-
      find .
      -path './.git' -prune -o
      -path './.idea' -prune -o
      -path './.gitlab-ci-local' -prune -o
      -path './bin' -prune -o
      -path './outputs' -prune -o
      -type f -name '*.md' -print0
      | xargs -0 printf '%q '
  SH_FILES:
    sh: >-
      find .
      -path './.git' -prune -o
      -path './.idea' -prune -o
      -path './.gitlab-ci-local' -prune -o
      -path './bin' -prune -o
      -path './outputs' -prune -o
      -type f -name '*.sh' -print0
      | xargs -0 printf '%q '

  DOCKER_RUN_CMD: "docker run --rm --network host -v {{.ROOT_DIR}}:/workdir -w /workdir"
  GOBOOT_IMAGE: "goboot:{{.VERSION}}"

  # Linter commands.
  GOLANGCI_LINT_CMD: '{{.DOCKER_RUN_CMD}} golangci/golangci-lint:{{.GOLANGCI_LINT_VERSION}} golangci-lint run ./...'
  YAML_LINT_CMD: '{{.DOCKER_RUN_CMD}} pipelinecomponents/yamllint:{{.YAMLLINT_VERSION}} yamllint .'
  CHECKMAKE_LINT_CMD: '{{.DOCKER_RUN_CMD}} cytopia/checkmake:{{.CHECKMAKE_VERSION}} Makefile'
  MD_LINT_CMD: '{{.DOCKER_RUN_CMD}} ghcr.io/igorshubovych/markdownlint-cli:{{.MARKDOWNLINT_VERSION}} markdownlint {{.MD_FILES}}'

  # Shell tooling.
  SHELLCHECK_CMD: '{{.DOCKER_RUN_CMD}} koalaman/shellcheck:{{.SHELLCHECK_VERSION}} -x {{.SH_FILES}}'
  SHFMT_CHECK_CMD: '{{.DOCKER_RUN_CMD}} mvdan/shfmt:{{.SHFMT_VERSION}} -d -i 2 -ci {{.SH_FILES}}'

  EDITORCONFIG_CHECKER_CONTAINER: 'mstruebing/editorconfig-checker:{{.EDITORCONFIG_CHECKER_VERSION}}'
  EDITORCONFIG_CHECKER_CMD: >-
    {{.DOCKER_RUN_CMD}} --entrypoint ec {{.EDITORCONFIG_CHECKER_CONTAINER}}
    -exclude "(\\.git|\\.idea|\\.gitlab-ci-local|bin)"

  TEST_COVER_FILE: "coverage.txt"
  MIN_COVERAGE: "80"

# Task definitions.
tasks:
  default:
    desc: Run build, lint, test, and verification checks (default task)
    cmds:
      - task: build
      - task: lint
      - task: test
      - task: verify:intro
      - task: verify:ci-canary

  build:
    desc: Build the Go binary
    cmd: go build -ldflags="-X main.version={{.VERSION}}" -o bin/goboot ./cmd/goboot
    # `-X` injects version into `main.version`.

  docker:build:
    desc: Build the goboot container image
    cmd: docker build --build-arg VERSION="{{.VERSION}}" -t "{{.GOBOOT_IMAGE}}" .

  docker:smoke:
    desc: Build and smoke-test the goboot container image
    cmds:
      - task: docker:build
      - |
          docker run --rm --entrypoint sh "{{.GOBOOT_IMAGE}}" -c '
            status=0
            goboot -h >/tmp/goboot-help 2>&1 || status=$?
            { test "$status" -eq 0 || test "$status" -eq 1; } && test -s /tmp/goboot-help
          '

  lint:
    desc: Run linters
    cmds:
      - '{{.GOLANGCI_LINT_CMD}}'         #  Static analysis for all Go source files
      - '{{.YAML_LINT_CMD}}'             #  YAML syntax and formatting
      - '{{.CHECKMAKE_LINT_CMD}}'        #  Lint for Makefile syntax / conventions
      - '{{.MD_LINT_CMD}}'               #  Markdown lint via container
      - '{{.SHELLCHECK_CMD}}'            #  ShellCheck for shell scripts
      - '{{.SHFMT_CHECK_CMD}}'           #  shfmt for shell scripts (check only)
      - '{{.EDITORCONFIG_CHECKER_CMD}}'  #  EditorConfig checker

  test:
    desc: Run all tests with coverage
    cmds:
      - |
          TEST_PKGS="$(
            go list ./... \
              | grep -v "/test/noauto" \
              | grep -v "/templates"
          )"

          go test \
            -race \
            -timeout=9m \
            -coverprofile "{{.TEST_COVER_FILE}}" \
            ${TEST_PKGS}
      - go tool cover -func="{{.TEST_COVER_FILE}}"
      - ./scripts/check_coverage.sh "{{.TEST_COVER_FILE}}" "{{.MIN_COVERAGE}}"
      - rm -f "{{.TEST_COVER_FILE}}"

  version:
    desc: Print current version
    cmd: 'echo "Current version: {{.VERSION}}"'

  verify:intro:
    desc: Regenerate Intro project matrix and run the full root + output verification flow
    cmd: ./scripts/verify_introproject.sh

  verify:ci-canary:
    desc: Run local CI simulation for both providers
    cmd: ./scripts/verify_ci_canary.sh --provider=both
